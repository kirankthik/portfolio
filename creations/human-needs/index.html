<style>
/* Layout: an architectural model on a drafting board (3D stage) beside a reading panel; stacks on phones. */
:root {
  --bg: #E7EBEF;
  --surface: #FBFCFD;
  --surface-2: #EEF2F5;
  --ink: #17202B;
  --muted: #536072;
  --line: #C8D1DB;
  --scene: #DCE2E8;
  --grid: #C0CAD4;
  --body-c: #B8741A;
  --mind-c: #23759D;
  --bonds-c: #AE3F68;
  --life-c: #6650B0;
  --met: #2C8752;
  --strain: #C98C0E;
  --fail: #CC3B27;
  --supply: #0F8780;
  --focus: #23759D;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1218; --surface: #141B23; --surface-2: #1A232D; --ink: #E4EAF1; --muted: #95A2B1; --line: #2A3542;
    --scene: #0A0F14; --grid: #1D2731;
    --body-c: #E09E45; --mind-c: #52A8D5; --bonds-c: #E0769E; --life-c: #9C88E7;
    --met: #4BC089; --strain: #EDBC46; --fail: #F06B56; --supply: #3CC6BE; --focus: #52A8D5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1218; --surface: #141B23; --surface-2: #1A232D; --ink: #E4EAF1; --muted: #95A2B1; --line: #2A3542;
  --scene: #0A0F14; --grid: #1D2731;
  --body-c: #E09E45; --mind-c: #52A8D5; --bonds-c: #E0769E; --life-c: #9C88E7;
  --met: #4BC089; --strain: #EDBC46; --fail: #F06B56; --supply: #3CC6BE; --focus: #52A8D5;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 410px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; min-width: 0; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 800 clamp(22px, 2.6vw, 30px)/1.05 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.brand h1 .count { color: var(--mind-c); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 62ch; }
.lenses { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; scrollbar-width: none; }
.lenses::-webkit-scrollbar { display: none; }
.lens { flex: none; border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.lens:hover { color: var(--ink); }
.lens[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.stage { position: relative; min-height: 0; min-width: 0; border-radius: 12px; overflow: hidden; background: var(--scene); border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.stage.hovering canvas { cursor: pointer; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lab { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; transition: opacity .2s; }
.flabel { font: 700 11.5px/1 var(--font-body); padding: 4px 7px 4px 5px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.12); display: flex; gap: 5px; align-items: center; }
.flabel .c { font: 600 10.5px/1 var(--font-mono); color: var(--c); }
.flabel.crowded { opacity: .12; }
.flabel.dim { opacity: .35; }
.stage.narrow .flabel .n { display: none; }
.stage.narrow .alabel span, .stage.narrow .elabel { display: none; }
.stage.narrow .llabel { font-size: 11px; }
.slabel { font: 600 10px/1 var(--font-mono); padding: 2px 4px; border-radius: 4px; background: var(--surface); color: var(--c); border: 1px solid var(--line); }
.llabel { pointer-events: auto; cursor: pointer; border: 0; background: transparent; font: 800 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--c); padding: 4px; text-shadow: 0 0 6px var(--scene), 0 0 2px var(--scene); }
.alabel { font: 600 10.5px/1.2 var(--font-mono); letter-spacing: .06em; color: var(--muted); text-align: center; }
.alabel b { display: block; color: var(--ink); font-size: 11.5px; }
.elabel { font: 700 10.5px/1.2 var(--font-body); color: var(--muted); background: var(--scene); padding: 2px 5px; border-radius: 4px; }

.tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; padding-top: env(safe-area-inset-top, 0px); }
.tools button { border: 1px solid var(--line); background: var(--surface); padding: 5px 9px; border-radius: 7px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.tools button:hover { border-color: var(--muted); }
.hint { position: absolute; left: 10px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 5px 9px; border-radius: 7px; max-width: calc(100% - 20px); }
.legend { position: absolute; right: 10px; bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; display: grid; gap: 4px; max-width: 250px; }
.legend:empty { display: none; }
.legend .row { display: flex; align-items: center; gap: 7px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; background: var(--c); border: 1px solid rgba(0,0,0,.15); }
.sw.ghost { background: transparent; border: 1.5px dashed var(--muted); }
.sw.line { height: 3px; border: 0; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 260px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 3; }
.tip b { display: block; font-size: 13.5px; }
.tip .c { font: 600 11px var(--font-mono); color: var(--c); }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

.panel { min-height: 0; min-width: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overscroll-behavior: contain; }
.pbody { padding: 18px 20px 24px; display: grid; gap: 14px; }
.pbody > * { margin: 0; min-width: 0; }
.eyebrow { font: 600 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.pbody h2 { font: 800 23px/1.15 var(--font-display); margin: 2px 0 0; text-wrap: balance; }
.pbody h3 { font: 700 12px/1.3 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -6px; }
.pbody p { margin: 0; }
.lede { font-size: 15.5px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); display: grid; gap: 6px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13.5px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); padding: 4px 9px 4px 6px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 700; }
.chip .c { font: 600 11px var(--font-mono); color: var(--c); }
.chip:hover { border-color: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .c { color: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* the 2D table */
.mini { display: grid; grid-template-columns: 52px repeat(4, minmax(0, 1fr)); gap: 3px; font-size: 12px; }
.mini .h { font: 600 10px/1.2 var(--font-mono); color: var(--muted); text-align: center; padding: 2px 0 4px; letter-spacing: .04em; }
.mini .lv { font: 800 11px/1.15 var(--font-display); color: var(--c); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; }
.mini .cell { background: var(--surface-2); border-radius: 6px; padding: 3px; display: grid; gap: 2px; align-content: start; border-top: 3px solid var(--c); }
.mini button { text-align: left; border: 0; background: transparent; border-radius: 4px; padding: 3px 4px; cursor: pointer; line-height: 1.2; font-size: 11.5px; font-weight: 700; overflow-wrap: anywhere; }
.mini button .c { font: 600 10px var(--font-mono); color: var(--c); margin-right: 2px; }
.mini button:hover, .mini button[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--c); }

.toggles { display: grid; gap: 6px; }
.toggles label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.toggles input { accent-color: var(--ink); width: 16px; height: 16px; }

/* need detail */
.needhead { display: flex; gap: 12px; align-items: flex-start; }
.bigcode { flex: none; font: 600 15px/1 var(--font-mono); color: var(--surface); background: var(--c); border-radius: 8px; min-width: 44px; height: 44px; display: grid; place-items: center; padding: 0 6px; }
.def { font-size: 16.5px; line-height: 1.45; }
.facts { display: grid; gap: 10px; margin: 0; }
.facts > div { border-left: 3px solid var(--c, var(--line)); padding-left: 10px; }
.facts dt { font: 700 11.5px/1.3 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; }
.ttf { display: inline-block; margin-top: 4px; font: 600 11px var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
.ways { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ways th { text-align: left; vertical-align: top; padding: 7px 10px 7px 0; width: 84px; font: 700 12px/1.4 var(--font-body); color: var(--muted); }
.ways td { padding: 7px 0; border-top: 1px solid var(--line); }
.ways tr:first-child td { border-top: 0; }
.backbtn { justify-self: start; border: 0; background: transparent; padding: 0; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; }
.backbtn:hover { color: var(--ink); }

/* tour */
.dots { display: flex; gap: 5px; }
.dots span { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.dots span.on { background: var(--ink); }

/* life stages */
.range { width: 100%; accent-color: var(--ink); }
.ticks { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11.5px; color: var(--muted); text-align: center; margin-top: -4px; }
.ticks span:first-child { text-align: left; } .ticks span:last-child { text-align: right; }
.ticks span.on { color: var(--ink); font-weight: 700; }

/* deprive */
.clock { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.clock .t { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.cutgrid { display: grid; gap: 8px; }
.cutgrid .lvrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cutgrid .lvname { font: 800 11px var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: var(--c); width: 46px; }
.chip.cut { background: var(--fail); border-color: var(--fail); color: #fff; }
.chip.cut .c { color: #fff; }
.status { display: grid; gap: 6px; font-size: 13.5px; }
.status .row { display: flex; gap: 8px; align-items: baseline; }
.pill { flex: none; font: 600 10.5px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px; color: #fff; background: var(--c); text-transform: uppercase; letter-spacing: .04em; }
.banner { border-radius: 10px; padding: 12px 14px; background: var(--ink); color: var(--surface); font-weight: 700; }

/* scenarios and test bench */
.list { display: grid; gap: 6px; }
.item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; cursor: pointer; display: grid; gap: 2px; }
.item:hover { border-color: var(--muted); }
.item[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.item b { font-size: 14.5px; }
.item span { font-size: 12.5px; color: var(--muted); }
.tests { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.test { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13.5px; align-items: start; }
.test:first-child { border-top: 0; }
.test .k { font: 600 11px/1.3 var(--font-mono); color: var(--muted); }
.res { display: inline-block; font: 600 10.5px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 3px 6px; border-radius: 4px; color: #fff; margin-right: 6px; vertical-align: 1px; }
.res.pass { background: var(--met); } .res.fail { background: var(--fail); } .res.contested { background: var(--strain); } .res.na { background: var(--muted); }
.verdict { font-weight: 700; font-size: 15px; }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(250px, 50%) minmax(0, 1fr); gap: 10px; padding-block: 10px; }
  .brand p { display: none; }
  .legend { display: none; }
  .hint { font-size: 11px; }
  .pbody { padding: 14px 16px 22px; }
}
@media (prefers-reduced-motion: reduce) { .lab { transition: none; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1><span class="count">Twenty-Four</span> Needs</h1>
      <p>Seven AI agents with opposed worldviews argued their way to one map of human needs. Here it is as a structure you can walk around.</p>
    </div>
    <nav class="lenses" role="tablist" aria-label="Views" id="lenses"></nav>
  </header>
  <section class="stage" id="stage" aria-label="3D model of the needs">
    <div class="labels" id="labels"></div>
    <div class="tools" id="tools">
      <button data-cam="overview" type="button">Overview</button>
      <button data-cam="side" type="button">Side</button>
      <button data-cam="top" type="button">Top</button>
    </div>
    <div class="hint" id="hint">Drag to turn · Scroll or pinch to zoom · Right-drag to pan · Click a block</div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
  </section>
  <aside class="panel" id="panel" aria-label="Details"><div class="pbody" id="pbody"></div></aside>
</div>

<script>
(function () {

var FUNCS = {

  restore: { key: "RESTORE", word: "recover", x:  1.6, text: "Wear from its own operation" },
  out:     { key: "OUT",     word: "use",     x:  4.8, text: "Decay through disuse" }
};
var FN_ORDER = ["in", "guard", "restore", "out"];

var LEVELS = {
  body:  { roman: "I",   name: "Body",  y: 0,   z: 0,    present: "From conception",
           text: "An organism that must persist. This is the only strict dependency: the dead have no needs." },
  mind:  { roman: "II",  name: "Mind",  y: 3.3, z: 2.7,  present: "From birth",
           text: "An agent that steers by a model of its world." },
  bonds: { roman: "III", name: "Bonds", y: 3.3, z: -2.7, present: "From birth",
           text: "A social being, formed and sustained by others." },
  life:  { roman: "IV",  name: "Life",  y: 6.6, z: 0,    present: "Wherever a person can grasp their life as a whole",

var LEVEL_ORDER = ["life", "bonds", "mind", "body"];

var FAMILIES = [
  { id: "1",  name: "Exchange",       level: "body",  fn: "in",      subs: ["1a", "1b", "1c", "1d", "1e"] },
  { id: "2",  name: "Protection",     level: "body",  fn: "guard",   subs: ["2"] },
  { id: "3",  name: "Sleep",          level: "body",  fn: "restore", subs: ["3"] },

  { id: "6",  name: "Security",       level: "mind",  fn: "guard",   subs: ["6"] },
  { id: "7",  name: "Respite",        level: "mind",  fn: "restore", subs: ["7"] },
  { id: "8",  name: "Agency",         level: "mind",  fn: "out",     subs: ["8a", "8b", "8c"] },
  { id: "9",  name: "Belonging",      level: "bonds", fn: "in",      subs: ["9a", "9b"] },
  { id: "10", name: "Standing",       level: "bonds", fn: "guard",   subs: ["10"] },
  { id: "11", name: "Withdrawal",     level: "bonds", fn: "restore", subs: ["11"] },
  { id: "12", name: "Contribution",   level: "bonds", fn: "out",     subs: ["12"] },
  { id: "13", name: "Meaning",        level: "life",  fn: "in",      subs: ["13"] },

  { id: "15", name: "Reconciliation", level: "life",  fn: "restore", subs: ["15"] },
  { id: "16", name: "Purpose",        level: "life",  fn: "out",     subs: ["16"] }
];

var M = 1, H = 60, D = 1440, W = 10080, MO = 43800, Y = 525600;

var NEEDS = [
  { id: "1a", fam: "1", name: "Air",
    def: "Air to breathe: oxygen in, carbon dioxide out.",
    unmet: "Hypoxia: unconsciousness, then death.", ttf: 4 * M, ttfLabel: "minutes", fatalAt: 6 * M,

  { id: "1b", fam: "1", name: "Water",
    def: "Enough fresh water to keep the body's fluid and salt in balance.",

    alone: "A castaway surrounded by seawater, with food and company, still dies of thirst.",
    band: "Drinking far too much dilutes the blood's salt and can kill.",
    ways: ["Springs, streams, water carried in gourds or eggshells.", "The well or cistern in the cloister.", "Tap water, bottled water, a water utility."] },
  { id: "1c", fam: "1", name: "Energy",
    def: "Enough food energy to fuel the body's work.",
    unmet: "Wasting: non-essential functions shut down, then death.", ttf: 5 * W, ttfLabel: "weeks", fatalAt: 9 * W,
    alone: "In a famine, people with water, shelter and family still waste away.",
    band: "Chronic excess energy drives obesity and metabolic disease.",
    ways: ["Tubers, nuts, game, honey.", "Bread, rice or alms-food at set hours.", "Supermarkets, canteens, delivery."] },
  { id: "1d", fam: "1", name: "Essential nutrients",
    def: "The molecules the body cannot make: essential amino and fatty acids, vitamins and minerals.",

    def: "Getting rid of the body's chemical waste.",
    unmet: "Self-poisoning.", ttf: 5 * D, ttfLabel: "days", fatalAt: 2 * W,
    alone: "When the kidneys fail, a person can be fed, watered and loved and still be poisoned by their own waste.",
    ways: ["Latrine sites downwind and away from camp.", "Latrines and drains built into the cloister.", "Toilets, sewers, and dialysis when kidneys fail."] },
  { id: "2", fam: "2", name: "Protection",

function curveFor(a, b, kind) {

function makeTube(curve, radius, twoHeads) {

    var dm = new THREE.Mesh(new THREE.SphereGeometry(radius * 2.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthWrite: false }));
    group.add(dm); dots.push({ mesh: dm, off: i / 3 });

}

    var off = 0;

  var n = NEED[id], base = C[n.level], bg = C.scene;
  var full = { color: col(base), opacity: 1, line: C.ink, lineOp: 0.22 };
  var dim = { color: mix(base, bg, 0.78), opacity: 0.32, line: C.ink, lineOp: 0.06 };
  var ghost = { color: col(base), opacity: 0.1, line: base, lineOp: 0.6 };
  function stateVis(s) {
    if (s === "fail") return { color: col(C.fail), opacity: 1, line: C.ink, lineOp: 0.3 };
    if (s === "strain") return { color: col(C.strain), opacity: 1, line: C.ink, lineOp: 0.3 };
    if (s === "absent") return ghost;
    if (s === "gone") return { color: mix(C.ink, bg, 0.72), opacity: 0.55, line: C.ink, lineOp: 0.12 };
    if (s === "pending") return { color: mix(base, bg, 0.35), opacity: 1, line: C.fail, lineOp: 1 };
    return { color: mix(C.met, bg, 0.45), opacity: 0.9, line: C.ink, lineOp: 0.15 };
  }
  switch (S.lens) {
    case "explore":
      if (S.levelInfo) return n.level === S.levelInfo ? full : dim;
      if (!S.selected) return full;
      var rel = relatedFams(NEED[S.selected].fam);
      return rel.has(n.fam) ? full : dim;
    case "tour":
      var f = TOUR[S.tour].focus;
      if (!f) return full;
      if (f.levels) return f.levels.indexOf(n.level) >= 0 ? full : dim;
      if (f.fams) return f.fams.indexOf(n.fam) >= 0 ? full : dim;
      return full;
    case "life-stages":
      var sup = supplierFor(S.stage, id);
      if (sup === "absent") return ghost;
      if (sup === "others") return { color: mix(base, bg, 0.72), opacity: 1, line: base, lineOp: 0.7 };
      if (sup === "shared") return { color: mix(base, bg, 0.38), opacity: 1, line: C.ink, lineOp: 0.2 };
      return full;
    case "deprive":
      return stateVis(simulate(S.time).st[id]);
    case "scenarios":
      if (!S.scenario) return full;
      return stateVis(S.scenario.states[id] || "met");
    case "is-it-a-need":
      if (!S.candidate) return full;
      return S.candidate.maps.indexOf(n.fam) >= 0 ? full : dim;
  }
  return full;
}

function edgeVisual(obj) {
  var e = obj.edge, typeColor = { column: C.ink, twin: C.bonds, row: C.muted, supply: C.supply }[e.type];
  var off = { visible: false };
  var on = { visible: true, color: typeColor, opacity: e.type === "row" ? 0.55 : 0.85 };
  var faint = { visible: true, color: typeColor, opacity: 0.12 };
  switch (S.lens) {
    case "explore":
      if (S.selected) {
        var fam = NEED[S.selected].fam;
        return (e.from === fam || e.to === fam) ? on : off;
      }
      return S.layers[e.type] ? on : off;
    case "tour":
      return TOUR[S.tour].layers[e.type] ? on : off;
    case "life-stages":
      var st = STAGES[S.stage];
      if (!st.edges[e.type]) return off;
      if (e.type === "twin") return (e.when === "dev") === st.dev ? on : off;
      if (e.type === "supply" && S.stage === 0 && (e.from === "13" || e.from === "16")) return off;
      return on;
    case "deprive":
      var sim = simulate(S.time);
      if (sim.death) return off;
      var srcFail = FAM[e.from].subs.some(function (id) { return sim.st[id] === "fail"; });
      var enabling = e.type === "column" || e.type === "twin" || (e.type === "row" && e.sub === "enable");
      if (srcFail && enabling) return { visible: true, color: C.fail, opacity: 0.95 };
      return (e.type === "column" || e.type === "twin") ? faint : off;
    case "scenarios":
      if (!S.scenario) return (e.type === "column" || e.type === "twin") ? on : off;
      var src = FAM[e.from].subs.some(function (id) { return S.scenario.states[id] === "fail"; });
      var enab = e.type === "column" || e.type === "twin";
      if (src && enab) return { visible: true, color: C.fail, opacity: 0.9 };
      return enab ? faint : off;
    case "is-it-a-need":
      return off;
  }
  return off;
}

function levelEdgeVisual() {
  var show = true;
  if (S.lens === "explore") show = S.layers.level && !S.selected;
  else if (S.lens === "tour") show = !!TOUR[S.tour].layers.level;
  else if (S.lens === "life-stages") show = !!STAGES[S.stage].edges.level;
  else if (S.lens === "deprive") show = !simulate(S.time).death;
  return show;
}

function refresh3D() {
  if (!has3D) return;
  NEED_IDS.forEach(function (id) {
    var b = blocks[id], v = blockVisual(id);
    var m = b.mesh.material;
    m.color.copy(v.color); m.opacity = v.opacity; m.transparent = v.opacity < 1; m.depthWrite = v.opacity > 0.6;
    b.mesh.castShadow = v.opacity > 0.6;
    b.lines.material.color.set(v.line); b.lines.material.opacity = v.lineOp;
    m.emissive.setRGB(0, 0, 0);
    if (S.hover === id) m.emissive.copy(col(C.ink)).multiplyScalar(0.12);
  });
  FAMILIES.forEach(function (f) {
    var p = blocks[f.subs[0]].plinth;
    p.material.color.copy(col(C["surface-2"]));
  });
  Object.keys(plates).forEach(function (lv) {
    var p = plates[lv];
    var absent = S.lens === "life-stages" && STAGES[S.stage].def[lv] === "absent";
    p.mesh.material.color.copy(mix(C[lv], C.scene, 0.55));
    p.mesh.material.opacity = absent ? 0.08 : 0.32;
    p.lines.material.color.set(C[lv]); p.lines.material.opacity = absent ? 0.35 : 0.75;
  });
  edgeObjs.forEach(function (o) {
    var v = edgeVisual(o);
    o.group.visible = !!v.visible;
    if (v.visible) { o.mat.color.set(v.color); o.mat.opacity = v.opacity; o.dots.forEach(function (d) { d.mesh.material.color.set(C.surface); d.mesh.visible = v.opacity > 0.3; }); }
  });
  var lv = levelEdgeVisual();
  levelEdgeObjs.forEach(function (o) {
    o.group.visible = lv;
    o.mat.color.set(C.ink); o.mat.opacity = 0.16;
    o.dots.forEach(function (d) { d.mesh.material.color.set(C.ink); d.mesh.material.opacity = 0.45; });
  });
  labelEls.forEach(function (r) { if (r.kind === "edge") r.el.hidden = !lv; });
  // selection box
  if (S.selected && blocks[S.selected]) {
    var b = blocks[S.selected];
    selBox.visible = true;
    selBox.position.copy(b.mesh.position);
    selBox.scale.set(b.w + 0.16, b.h + 0.16, b.d + 0.16);
    selBox.material.color.set(C.ink);
  } else selBox.visible = false;
}

function applyTheme() {
  if (!has3D) return;
  readColors();
  scene.background = col(C.scene);
  grid.material.color.set(C.grid);
  ground.material.opacity = document.documentElement.matches("[data-theme='dark']") || (window.matchMedia("(prefers-color-scheme: dark)").matches && !document.documentElement.matches("[data-theme='light']")) ? 0.35 : 0.14;
  refresh3D();
}

/* ------------------------------------------------------------------ */
/* Render loop                                                         */
/* ------------------------------------------------------------------ */
var tmpV = null, lastT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (fly) {
    var k = Math.min(1, (now - fly.start) / fly.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k >= 1) fly = null;
  }
  controls.update();
  var secs = now / 1000;
  if (!reduceMotion) {
    edgeObjs.concat(levelEdgeObjs).forEach(function (o) {
      if (!o.group.visible) return;
      o.dots.forEach(function (d) {
        var t = (secs * o.speed + d.off) % 1;
        if (o.twoHeads) t = 0.5 + 0.5 * Math.sin((secs * o.speed + d.off) * Math.PI * 2) * 0.92;
        d.mesh.position.copy(o.curve.getPointAt(t));
      });
    });
  } else if (!lastT) {
    edgeObjs.concat(levelEdgeObjs).forEach(function (o) { o.dots.forEach(function (d) { d.mesh.position.copy(o.curve.getPointAt(0.2 + d.off * 0.6)); }); });
  }
  lastT = now;
  renderer.render(scene, camera);
  placeLabels();
}

function placeLabels() {
  if (!tmpV) tmpV = new THREE.Vector3();
  var w = stageEl.clientWidth, h = stageEl.clientHeight;
  var camPos = camera.position, placed = [];
  var recs = labelEls.map(function (r) { return { r: r, dist: r.pos.distanceTo(camPos) }; }).sort(function (a, b) { return a.dist - b.dist; });
  var selFam = S.selected ? NEED[S.selected].fam : null;
  recs.forEach(function (o) {
    var r = o.r, el = r.el;
    if (r.kind === "edge" && el.hidden) return;
    tmpV.copy(r.pos).project(camera);
    var vis = tmpV.z < 1 && tmpV.x > -1.2 && tmpV.x < 1.2 && tmpV.y > -1.2 && tmpV.y < 1.2;
    if (r.kind === "sub") vis = vis && (o.dist < 12 || r.fam === selFam);
    if (!vis) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    var x = (tmpV.x * 0.5 + 0.5) * w, y = (-tmpV.y * 0.5 + 0.5) * h;
    if (!r.w) { r.w = el.offsetWidth; r.h = el.offsetHeight; }
    var tx = r.kind === "level" ? -r.w : -r.w / 2, ty = r.kind === "axis" ? 0 : -r.h;
    if (r.kind === "level") ty = -r.h / 2;
    el.style.transform = "translate3d(" + Math.round(x + tx) + "px," + Math.round(y + ty) + "px,0)";
    if (r.kind === "fam") {
      var rect = { l: x + tx, t: y + ty, r: x + tx + r.w, b: y + ty + r.h };
      var important = r.fam === selFam || (S.hover && NEED[S.hover].fam === r.fam);
      var crowded = !important && placed.some(function (p) { return rect.l < p.r && rect.r > p.l && rect.t < p.b && rect.b > p.t; });
      el.classList.toggle("crowded", crowded);
      if (!crowded) placed.push(rect);
      var v = blocks[FAM[r.fam].subs[0]].mesh.material.opacity;
      el.classList.toggle("dim", v < 0.6 && !important);
    }
  });
}

/* Interaction                                                         */
/* ------------------------------------------------------------------ */
function onBlockClick(id) {
  if (S.lens === "deprive") { toggleCut(id); return; }
  selectNeed(id, true);
}
function selectNeed(id, flyThere) {
  S.selected = id; S.levelInfo = null;
  if (S.lens === "explore") setHash("need-" + id);
  renderPanel(); refresh3D();
  if (flyThere) flyToFam(NEED[id].fam);
  var p = $("#panel"); if (p) p.scrollTop = 0;
}
function clearSelection() {
  S.selected = null; S.levelInfo = null;
  if (S.lens === "explore") setHash("explore");
  renderPanel(); refresh3D();
}
function showLevel(lv) {
  if (S.lens !== "explore") { S.lens = "explore"; renderTabs(); setHash("explore"); }
  S.selected = null; S.levelInfo = lv; renderPanel(); refresh3D();
  if (has3D) { var L = LEVELS[lv]; var t = new THREE.Vector3(0, L.y + 0.8, L.z); var dir = camera.position.clone().sub(controls.target).normalize(); flyTo({ pos: t.clone().add(dir.multiplyScalar(17)), target: t }, 900); }
}
function toggleCut(id) {
  if (S.cut.has(id)) S.cut.delete(id); else S.cut.add(id);
  renderPanel(); refresh3D();
}
function setLens(id, fromHash) {
  if (!LENSES.some(function (l) { return l.id === id; })) id = "explore";
  S.lens = id; S.selected = null; S.levelInfo = null; S.playing = false;
  if (id === "tour") applyTourStep();
  if (id === "deprive" && S.cut.size === 0) applyPreset(PRESETS[0], true);
  renderTabs(); renderPanel(); refresh3D(); renderLegend();
  if (!fromHash) setHash(id);
  if (id === "scenarios" && S.scenario) flyToFam(S.scenario.focus);
  if (id === "explore" || id === "life-stages" || id === "deprive" || id === "is-it-a-need") { if (has3D && id !== "explore") flyTo(CAMS.overview(), 900); }
}
function applyTourStep() {
  var st = TOUR[S.tour];
  if (has3D) flyTo(CAMS[st.cam](), 1100);
}
function applyPreset(p, quiet) {
  S.cut = new Set(p.cut); S.time = p.t; S.preset = p.id;
  if (!quiet) { renderPanel(); refresh3D(); }
}
var hashLock = false;
function setHash(h) {
  try { hashLock = true; if (location.hash !== "#" + h) location.hash = h; } catch (e) { /* ignore */ }
  setTimeout(function () { hashLock = false; }, 0);
}
function fromHash() {
  var h = (location.hash || "").slice(1);
  if (h.indexOf("need-") === 0 && NEED[h.slice(5)]) {
    if (S.lens !== "explore") { S.lens = "explore"; renderTabs(); renderLegend(); }
    selectNeed(h.slice(5), true); return;
  }
  setLens(h || "explore", true);
}
window.addEventListener("hashchange", function () { if (!hashLock) fromHash(); });

var pbody = $("#pbody");

function renderTabs() {
  var nav = $("#lenses");

    return '<button class="lens" role="tab" type="button" data-lens="' + l.id + '" aria-selected="' + (S.lens === l.id) + '">' + l.name + "</button>";
  }).join("");
}

function chip(id, extra) {

}
function famChip(fid, note) {

}

function miniTable() {
  var h = '<div class="mini" role="table" aria-label="The map as a table"><div class="h" role="columnheader"></div>';
  FN_ORDER.forEach(function (fn) { h += '<div class="h" role="columnheader">' + FUNCS[fn].key + "</div>"; });
  LEVEL_ORDER.forEach(function (lv) {
    h += '<div class="lv" style="--c:' + lvVar(lv) + '">' + LEVELS[lv].roman + " " + LEVELS[lv].name + "</div>";

      h += '<div class="cell" style="--c:' + lvVar(lv) + '">';

      });

    });

}

function needDetail(id) {
  var n = NEED[id], f = famOf(id), L = LEVELS[n.level], F = FUNCS[n.fn];

  h += '<button class="backbtn" type="button" data-act="back">← ' + (S.lens === "explore" ? "All needs" : "Back to " + LENSES.filter(function (l) { return l.id === S.lens; })[0].name) + "</button>";
  h += '<div class="needhead" style="--c:' + lvVar(n.level) + '"><span class="bigcode">' + n.id + '</span><div><p class="eyebrow">' + L.roman + " " + L.name + " · " + F.key + " (" + F.word + ")" + (f.subs.length > 1 ? " · family " + f.id + " " + f.name : "") + "</p><h2>" + n.name + "</h2></div></div>";
  h += '<p class="def">' + n.def + "</p>";
  h += '<dl class="facts" style="--c:' + lvVar(n.level) + '">';
  h += "<div><dt>When persistently unmet</dt><dd>" + n.unmet + '<br><span class="ttf">Rough time to harm: ' + n.ttfLabel + "</span></dd></div>";
  h += "<div><dt>Fails on its own when</dt><dd>" + n.alone + "</dd></div>";
  if (n.band) h += "<div><dt>Too much</dt><dd>" + n.band + "</dd></div>";
  h += "</dl>";
  h += "<h3>Met in three ways of life</h3>";
  h += '<table class="ways"><tbody>' + WAYS.map(function (w, i) { return "<tr><th scope=\"row\">" + w + "</th><td>" + n.ways[i] + "</td></tr>"; }).join("") + "</tbody></table>";
  if (f.subs.length > 1) h += "<h3>Also in family " + f.id + " " + f.name + '</h3><div class="chips">' + f.subs.filter(function (s) { return s !== id; }).map(function (s) { return chip(s); }).join("") + "</div>";
  if (deps.length) h += '<h3>Fed by</h3><div class="chips">' + deps.map(function (e) { return famChip(e.from, e.note); }).join("") + "</div><p class=\"small muted\">" + uniqueNotes(deps) + "</p>";
  if (feeds.length) h += '<h3>Feeds</h3><div class="chips">' + feeds.map(function (e) { return famChip(e.to, e.note); }).join("") + "</div><p class=\"small muted\">" + uniqueNotes(feeds) + "</p>";
  if (n.level === "body") h += '<p class="small muted">Body feeds everything: when a body need fails, every need above it comes under strain.</p>';

}
function uniqueNotes(list) { var s = []; list.forEach(function (e) { if (s.indexOf(e.note) < 0) s.push(e.note); }); return s.join(" "); }

function levelDetail(lv) {

function renderExplore() {

function tog(key, label, hint) {

function renderTour() {

function renderStages() {
  var st = STAGES[S.stage];
  var h = '<div><p class="eyebrow">Life stages</p><h2>' + st.name + "</h2></div>";
  h += '<input class="range" type="range" id="stage-range" min="0" max="4" step="1" value="' + S.stage + '" aria-label="Life stage">';

  h += '<p class="lede">' + st.text + "</p>";
  var counts = { others: 0, shared: 0, self: 0, absent: 0 };

  h += '<div class="card"><b>Who meets the 24 needs</b><span class="small">' +
    counts.others + " delivered by others · " + counts.shared + " shared · " + counts.self + " self-supplied" + (counts.absent ? " · " + counts.absent + " not yet present" : "") + "</span></div>";
  h += '<p class="small muted">Pale blocks are met by other people, mid-tone blocks are shared, solid blocks are self-supplied, and outlines are needs whose level is not present yet. The needs themselves do not change across a life; who supplies them does.</p>';
  return h;
}

function renderDeprive() {
  var sim = simulate(S.time);
  var h = '<div><p class="eyebrow">Deprive</p><h2>Cut a need, run the clock</h2></div>';
  h += '<p class="small">Click blocks in the model, or the chips below, to cut a need off. Then move the clock. Times are rough orders of magnitude.</p>';
  h += '<div class="btnrow">' + PRESETS.map(function (p) { return '<button class="chip" type="button" data-preset="' + p.id + '" aria-pressed="' + (S.preset === p.id) + '">' + p.name + "</button>"; }).join("") + "</div>";
  var pr = PRESETS.filter(function (p) { return p.id === S.preset; })[0];
  if (pr) h += '<p class="small muted">' + pr.note + "</p>";
  h += '<div class="clock"><span class="t" id="clock-t">' + fmtTime(S.time) + '</span><span class="btnrow"><button class="btn" type="button" data-act="play">' + (S.playing ? "Pause" : "Play") + '</button><button class="btn" type="button" data-act="clear">Clear</button></span></div>';
  h += '<input class="range" type="range" id="time-range" min="0" max="1000" value="' + timeToSlider(S.time) + '" aria-label="Time without the cut needs">';
  h += '<div class="ticks"><span>1 min</span><span>1 day</span><span>1 month</span><span>1 year</span><span>3 years</span></div>';
  h += '<div id="sim-status">' + simStatus(sim) + "</div>";
  h += "<h3>Cut off</h3>";
  h += '<div class="cutgrid">' + LEVEL_ORDER.slice().reverse().map(function (lv) {
    var ids = NEED_IDS.filter(function (id) { return NEED[id].level === lv; });
    return '<div class="lvrow"><span class="lvname" style="--c:' + lvVar(lv) + '">' + LEVELS[lv].name + "</span>" + ids.map(function (id) {
      var on = S.cut.has(id);
      return '<button type="button" class="chip' + (on ? " cut" : "") + '" data-cut="' + id + '" aria-pressed="' + on + '" style="--c:' + lvVar(lv) + '"><span class="c">' + id + "</span>" + NEED[id].name + "</button>";
    }).join("") + "</div>";
  }).join("") + "</div>";
  return h;
}
function simStatus(sim) {
  if (sim.death) return '<div class="banner">After ' + fmtTime(sim.death.t) + " without " + NEED[sim.death.id].name.toLowerCase() + ", the body ends. The dead have no needs: Body → everything is the one strict dependency.</div>";
  var fail = [], strain = [], pend = [];
  NEED_IDS.forEach(function (id) { var s = sim.st[id]; if (s === "fail") fail.push(id); else if (s === "strain") strain.push(id); else if (s === "pending") pend.push(id); });
  var h = '<div class="status">';
  h += '<div class="row"><span class="pill" style="--c:var(--fail)">Failing</span><span>' + (fail.length ? fail.map(function (id) { return id + " " + NEED[id].name; }).join(", ") : "None yet") + "</span></div>";
  h += '<div class="row"><span class="pill" style="--c:var(--strain)">Strained</span><span>' + (strain.length ? strain.map(function (id) { return id + " " + NEED[id].name; }).join(", ") : "None") + "</span></div>";
  if (pend.length) h += '<div class="row"><span class="pill" style="--c:var(--muted)">Cut, holding</span><span>' + pend.map(function (id) { return id + " " + NEED[id].name + " (" + NEED[id].ttfLabel + ")"; }).join(", ") + "</span></div>";
  return h + "</div>";
}

function renderScenarios() {
  var h = '<div><p class="eyebrow">Scenarios</p><h2>Real lives, one need at a time</h2></div>';
  if (S.scenario) {
    var sc = S.scenario;
    var fails = NEED_IDS.filter(function (id) { return sc.states[id] === "fail"; });
    var strains = NEED_IDS.filter(function (id) { return sc.states[id] === "strain"; });
    h += '<div class="card"><p class="eyebrow">' + sc.test + "</p><b style=\"font-size:17px\">" + sc.title + '</b><span class="small muted">' + sc.who + '</span><span>' + sc.story + "</span></div>";
    h += '<div class="status"><div class="row"><span class="pill" style="--c:var(--fail)">Failing</span><span class="chips">' + fails.map(function (id) { return chip(id); }).join("") + "</span></div>";
    if (strains.length) h += '<div class="row"><span class="pill" style="--c:var(--strain)">Strained</span><span class="chips">' + strains.map(function (id) { return chip(id); }).join("") + "</span></div>";
    h += '<div class="row"><span class="pill" style="--c:var(--met)">Met</span><span class="small">Everything else' + (sc.states["13"] === "absent" ? ", except the Life floor, which is not present yet" : "") + ".</span></div></div>";
    h += '<p class="lede">' + sc.lesson + "</p>";
    h += '<button class="backbtn" type="button" data-scn="">← All scenarios</button>';
  }
  h += '<div class="list">' + SCENARIOS.map(function (sc) {
    return '<button type="button" class="item" data-scn="' + sc.id + '" aria-pressed="' + (S.scenario && S.scenario.id === sc.id) + '"><b>' + sc.title + "</b><span>" + sc.tag + "</span></button>";
  }).join("") + "</div>";
  return h;
}

function renderTest() {
  var h = '<div><p class="eyebrow">Is it a need?</p><h2>Run a candidate through the tests</h2></div>';
  h += '<p class="small">Every need had to pass all four tests, plus the first check that it is a condition of a person. Pick a candidate the panel argued about.</p>';
  h += '<div class="chips">' + CANDIDATES.map(function (c, i) { return '<button type="button" class="chip" data-cand="' + i + '" aria-pressed="' + (S.candidate === c) + '">' + c.name + "</button>"; }).join("") + "</div>";
  if (S.candidate) {
    var c = S.candidate;
    h += '<div class="tests">' + c.rows.map(function (r, i) {
      var label = { pass: "pass", fail: "fail", contested: "contested", na: "n/a" }[r[0]];
      return '<div class="test"><span class="k">' + TESTS[i] + '</span><span><span class="res ' + r[0] + '">' + label + "</span>" + (r[1] || "") + "</span></div>";
    }).join("") + "</div>";
    h += '<p class="verdict">' + c.verdict + "</p>";
    if (c.maps.length) h += '<div class="chips">' + c.maps.map(function (f) { return famChip(f); }).join("") + "</div>";
  } else {
    h += '<div class="card"><span class="small"><b>Condition</b>: a state of the person, not an object, act, feeling, outcome or right.<br><b>T1</b>: true wherever its level exists, in every way of life.<br><b>T2</b>: absence causes detectable harm, whatever the person believes.<br><b>T3</b>: very different means can meet it.<br><b>T4</b>: it can fail while every other need is met.</span></div>';
  }
  return h;
}

function renderPanel() {
  var h;
  if (S.selected && S.lens !== "explore") h = needDetail(S.selected);
  else switch (S.lens) {
    case "tour": h = renderTour(); break;
    case "life-stages": h = renderStages(); break;
    case "deprive": h = renderDeprive(); break;
    case "scenarios": h = renderScenarios(); break;
    case "is-it-a-need": h = renderTest(); break;
    default: h = renderExplore();
  }
  pbody.innerHTML = h;
}

function renderLegend() {
  var lg = $("#legend"), h = "";
  function row(c, label, cls) { return '<div class="row"><span class="sw ' + (cls || "") + '" style="--c:' + c + '"></span>' + label + "</div>"; }
  if (S.lens === "explore" || S.lens === "tour" || S.lens === "is-it-a-need") {
    h = row("var(--body-c)", "I Body") + row("var(--mind-c)", "II Mind") + row("var(--bonds-c)", "III Bonds") + row("var(--life-c)", "IV Life") + '<div class="row muted">Taller block = harms sooner</div>';
  } else if (S.lens === "life-stages") {
    h = row("var(--muted)", "Solid: self-supplied") + row("color-mix(in srgb, var(--muted) 45%, var(--scene))", "Mid-tone: shared") + row("color-mix(in srgb, var(--muted) 20%, var(--scene))", "Pale: delivered by others") + row("", "Not present yet", "ghost");
  } else {
    h = row("var(--fail)", "Failing") + row("var(--strain)", "Strained (fed by a failing need)") + row("color-mix(in srgb, var(--met) 55%, var(--scene))", "Met") + (S.lens === "deprive" ? row("var(--scene)", "Cut, not failed yet (red outline)") : "") + '<div class="row"><span class="sw line" style="--c:var(--fail)"></span>Strain travelling up</div>';
  }
  lg.innerHTML = h;
}

/* panel events */
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("button, a");
  if (!t) return;
  if (t.dataset.lens) { setLens(t.dataset.lens); return; }
  if (t.dataset.lensGo) { setLens(t.dataset.lensGo); return; }
  if (t.dataset.cam && has3D) { flyTo(CAMS[t.dataset.cam](), 900); return; }
  if (t.dataset.need) { if (S.lens === "deprive") { toggleCut(t.dataset.need); return; } selectNeed(t.dataset.need, true); return; }
  if (t.dataset.cut) { toggleCut(t.dataset.cut); return; }
  if (t.dataset.preset) { var p = PRESETS.filter(function (x) { return x.id === t.dataset.preset; })[0]; S.playing = false; applyPreset(p); return; }
  if (t.dataset.scn !== undefined) {
    var sc = SCENARIOS.filter(function (x) { return x.id === t.dataset.scn; })[0] || null;
    S.scenario = sc; S.selected = null; renderPanel(); refresh3D(); renderLegend();
    if (sc) flyToFam(sc.focus); else if (has3D) flyTo(CAMS.overview(), 900);
    $("#panel").scrollTop = 0; return;
  }
  if (t.dataset.cand !== undefined) { S.candidate = CANDIDATES[+t.dataset.cand]; renderPanel(); refresh3D(); if (has3D) flyTo(CAMS.overview(), 900); return; }
  var act = t.dataset.act;
  if (act === "back") { clearSelection(); return; }
  if (act === "tour-next") { S.tour = Math.min(TOUR.length - 1, S.tour + 1); applyTourStep(); renderPanel(); refresh3D(); return; }
  if (act === "tour-prev") { S.tour = Math.max(0, S.tour - 1); applyTourStep(); renderPanel(); refresh3D(); return; }
  if (act === "clear") { S.cut = new Set(); S.preset = null; S.playing = false; renderPanel(); refresh3D(); return; }
  if (act === "play") { togglePlay(); return; }
});
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "stage-range") { S.stage = +t.value; renderPanel(); refresh3D(); var r = $("#stage-range"); if (r) r.focus(); }
  if (t.id === "time-range") { S.time = sliderToTime(+t.value); S.playing = false; updateSim(); }
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.dataset && t.dataset.layer) { S.layers[t.dataset.layer] = t.checked; refresh3D(); }
});

function updateSim() {
  var c = $("#clock-t"); if (c) c.textContent = fmtTime(S.time);
  var s = $("#sim-status"); if (s) s.innerHTML = simStatus(simulate(S.time));
  var r = $("#time-range"); if (r && document.activeElement !== r) r.value = timeToSlider(S.time);
  var pb = document.querySelector('[data-act="play"]'); if (pb) pb.textContent = S.playing ? "Pause" : "Play";
  refresh3D();
}
function togglePlay() {
  S.playing = !S.playing;
  if (S.playing) {
    var v0 = timeToSlider(S.time); if (v0 >= 995) v0 = 0;
    var start = performance.now(), dur = 9000 * (1 - v0 / 1000);
    (function step(now) {
      if (!S.playing || S.lens !== "deprive") return;
      var k = Math.min(1, (now - start) / Math.max(dur, 1));
      S.time = sliderToTime(v0 + (1000 - v0) * k);
      var r = $("#time-range"); if (r) r.value = timeToSlider(S.time);
      if (simulate(S.time).death || k >= 1) S.playing = false;
      updateSim();
      if (S.playing) requestAnimationFrame(step);
    })(start);
  }
  updateSim();
}

/* theme changes */
if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", applyTheme);
}
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
renderTabs();
renderLegend();
try { init3D(); }
catch (err) {
  var fb = document.createElement("div"); fb.className = "fallback";
  fb.innerHTML = "<p>This browser could not start the 3D model. Everything is still available in the panel: open any need from the table.</p>";
  stageEl.appendChild(fb); $("#tools").hidden = true; $("#hint").hidden = true;
}
fromHash();
})();
</script>
